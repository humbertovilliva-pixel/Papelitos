<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Papelitos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:  #f4efe4;
      --cream2: #ebe4d0;
      --ink:    #1c1a16;
      --ink2:   #6a5f50;
      --line:   #d6ccb6;
      --paper:  #fdf8f0;
      --red:    #b83a22;
      --green:  #2a6e49;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      background-image: repeating-linear-gradient(transparent, transparent 31px, var(--line) 31px, var(--line) 32px);
      min-height: 100vh;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    #app { max-width: 460px; margin: 0 auto; padding: 16px 16px 56px; }

    .title    { font-family: 'Caveat', cursive; font-size: 3rem;  font-weight: 700; line-height: 1; }
    .subtitle { font-family: 'Caveat', cursive; font-size: 2rem;  font-weight: 700; }
    .label    { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink2); }
    .text-muted  { color: var(--ink2); }
    .text-sm     { font-size: 0.875rem; }
    .text-center { text-align: center; }

    .card      { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 16px; box-shadow: 2px 3px 0 var(--line); }
    .card-flat { background: var(--cream2); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px; }

    input[type=text], input[type=number] {
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--ink);
      background: var(--cream); border: 1px solid var(--line); border-radius: 3px;
      padding: 9px 12px; outline: none; transition: border-color 0.15s; width: 100%;
      -webkit-appearance: none; appearance: none;
    }
    input:focus          { border-color: var(--ink2); }
    input[type=number]   { width: auto; text-align: center; }
    input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--ink); cursor: pointer; flex-shrink: 0; }

    .btn {
      display: -webkit-inline-flex; display: inline-flex;
      -webkit-align-items: center; align-items: center;
      -webkit-justify-content: center; justify-content: center;
      gap: 6px; padding: 12px 18px; border: none; border-radius: 3px;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; -webkit-transition: opacity 0.15s, -webkit-transform 0.08s; transition: opacity 0.15s, transform 0.08s;
    }
    .btn:active   { -webkit-transform: scale(0.97); transform: scale(0.97); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .btn-block    { display: -webkit-flex; display: flex; width: 100%; }
    .btn-dark     { background: var(--ink);   color: #fff; }
    .btn-green    { background: var(--green); color: #fff; }
    .btn-ghost    { background: transparent; border: 1.5px solid var(--line); color: var(--ink2); }
    .btn-sm       { padding: 7px 13px; font-size: 0.82rem; }
    .btn-icon     { background: none; border: none; cursor: pointer; color: var(--ink2); font-size: 1rem; padding: 4px 6px; border-radius: 3px; line-height: 1; flex-shrink: 0; }
    .btn-icon:hover { color: var(--red); }

    .mode-tabs { display: -webkit-flex; display: flex; gap: 8px; margin-top: 8px; }
    .mode-tabs .btn { -webkit-flex: 1; flex: 1; }

    .round-badge   { display: inline-block; padding: 3px 10px; border: 1.5px solid var(--ink); border-radius: 99px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; }
    .timer-display { font-family: 'Caveat', cursive; font-size: 6.5rem; font-weight: 700; text-align: center; line-height: 1; }
    .timer-urgent  { color: var(--red); }
    .big-word      { font-family: 'Caveat', cursive; font-size: 3.8rem; font-weight: 700; text-align: center; line-height: 1.1; }

    .score-row            { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: center; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .score-row:last-child { border-bottom: none; }
    .score-num { font-family: 'Caveat', cursive; font-size: 1.8rem; font-weight: 700; }
    .word-tag  { display: inline-block; background: var(--cream2); border-radius: 2px; padding: 2px 9px; margin: 3px 2px; font-family: 'Caveat', cursive; font-size: 1.1rem; }
    .tag-won   { background: #d4ead9; }

    .team-preview { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 10px; padding: 12px 14px; border-left: 4px solid; background: var(--paper); border-radius: 0 3px 3px 0; margin-top: 10px; box-shadow: 2px 2px 0 var(--line); }
    .player-chip  { display: inline-block; background: var(--cream2); border-radius: 99px; padding: 3px 12px; font-weight: 600; font-size: 0.95rem; margin: 2px; }

    .mt4  { margin-top: 4px;  } .mt8  { margin-top: 8px;  }
    .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
    .mt24 { margin-top: 24px; }
    .flex-center  { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
    .flex-between { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: center; align-items: center; }
    .gap8 { gap: 8px; }
    hr.divider { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  </style>
</head>
<body>
<div id="app"></div>
<script>

var ROUND_INFO = [
  { label: 'Ronda 1', rule: 'Habla libremente \u2014 sin decir la palabra ni ninguna parte de ella' },
  { label: 'Ronda 2', rule: 'Solo puedes decir UNA palabra' },
  { label: 'Ronda 3', rule: 'Solo m\u00edmica \u2014 sin hablar ni hacer ning\u00fan sonido' }
];
var COLORS = ['#2d6a4f','#c0392b','#1a5276','#7d3c98','#b7950b','#117a65'];
var MEDALS = ['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49','4\u00ba','5\u00ba','6\u00ba'];

var G = {
  screen: 'config',
  configMode: 'manual',
  teams: [
    { name: 'Equipo 1', players: [{ name: '' }, { name: '' }] },
    { name: 'Equipo 2', players: [{ name: '' }, { name: '' }] }
  ],
  randomPlayers: ['', '', '', ''],
  wordsPerPlayer: 5,
  turnTime: 60,
  allowPass: true,
  maxPasses: 3,
  allPlayers: [],
  entryIdx: 0,
  showBlank: false,
  round: 1,
  allWords: [],
  bowl: [],
  scores: [],
  teamTurnIdx: 0,
  explainerPerTeam: [],
  currentWord: null,
  guessedThisTurn: [],
  passesUsed: 0,
  timeLeft: 0,
  timerHandle: null,
  gamePhase: 'turn-ready',
  bowlEmptiedThisTurn: false
};

// ── Audio ─────────────────────────────────────────────────────────────────────
var audioCtx = null;
function ensureAudio() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch(e) { return null; }
}
function playBuzzer() {
  var ctx = ensureAudio();
  if (!ctx) return;
  var now = ctx.currentTime;
  var tones = [[480,0,0.18],[380,0.22,0.18],[260,0.44,0.5]];
  for (var i = 0; i < tones.length; i++) {
    try {
      var freq = tones[i][0], t = tones[i][1], dur = tones[i][2];
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.connect(g);
      g.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.18, now + t);
      g.gain.exponentialRampToValueAtTime(0.001, now + t + dur);
      osc.start(now + t);
      osc.stop(now + t + dur + 0.05);
    } catch(e) {}
  }
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function esc(s) {
  if (s === null || s === undefined) s = '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function col(i) { return COLORS[i % COLORS.length]; }
function scoreVal(i) { return G.scores[i] != null ? G.scores[i] : 0; }

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  if (G.screen === 'config') {
    app.innerHTML = screenConfig();
  } else if (G.screen === 'rnd-preview') {
    app.innerHTML = screenRndPreview();
  } else if (G.screen === 'word-entry') {
    app.innerHTML = G.showBlank ? screenBlank() : screenWordEntry();
    if (!G.showBlank) {
      setTimeout(function() {
        var el = document.getElementById('word-0');
        if (el) el.focus();
      }, 60);
    }
  } else {
    var html = '';
    if      (G.gamePhase === 'turn-ready')  html = screenTurnReady();
    else if (G.gamePhase === 'turn-active') html = screenTurnActive();
    else if (G.gamePhase === 'turn-done')   html = screenTurnDone();
    else if (G.gamePhase === 'round-end')   html = screenRoundEnd();
    else if (G.gamePhase === 'game-over')   html = screenGameOver();
    app.innerHTML = html;
  }
}

function scoreWidget() {
  var rows = '';
  for (var i = 0; i < G.teams.length; i++) {
    rows += '<div class="score-row"><span>' + esc(G.teams[i].name) + '</span>' +
            '<span class="score-num" style="color:' + col(i) + '">' + scoreVal(i) + '</span></div>';
  }
  return '<div class="card mt8">' + rows + '</div>';
}

// ── Screen: Config ────────────────────────────────────────────────────────────
function screenConfig() {
  var isManual = G.configMode === 'manual';

  var teamsHtml = '';
  for (var ti = 0; ti < G.teams.length; ti++) {
    var t = G.teams[ti];
    var removeBtn = G.teams.length > 2
      ? '<button class="btn-icon" data-action="remove-team" data-ti="' + ti + '">&#x2715;</button>'
      : '';
    var playerInputs = '';
    for (var pi = 0; pi < t.players.length; pi++) {
      playerInputs += '<div style="margin-top:7px;">' +
        '<input type="text" data-action="player-name" data-ti="' + ti + '" data-pi="' + pi + '"' +
        ' value="' + esc(t.players[pi].name) + '" placeholder="Jugador ' + (pi+1) + '">' +
        '</div>';
    }
    teamsHtml += '<div class="card" style="border-left:4px solid ' + col(ti) + ';padding:14px 16px;margin-bottom:10px;">' +
      '<div class="flex-center gap8">' +
        '<input type="text" data-action="team-name" data-ti="' + ti + '"' +
        ' value="' + esc(t.name) + '" placeholder="Nombre del equipo" style="flex:1;font-weight:600;">' +
        removeBtn +
      '</div>' +
      '<div style="margin-top:10px;">' +
        '<span class="label">Jugadores (exactamente 2)</span>' +
        playerInputs +
      '</div>' +
    '</div>';
  }

  var randomInputs = '';
  for (var ri = 0; ri < G.randomPlayers.length; ri++) {
    randomInputs += '<div' + (ri > 0 ? ' style="margin-top:8px;"' : '') + '>' +
      '<input type="text" data-action="random-player-name" data-idx="' + ri + '"' +
      ' value="' + esc(G.randomPlayers[ri]) + '" placeholder="Jugador ' + (ri+1) + '"' +
      ' autocomplete="off" autocorrect="off">' +
      '</div>';
  }

  var manualSection = '<div class="mt16">' +
    '<div class="flex-between" style="margin-bottom:10px;">' +
      '<span class="label">Equipos (2 jugadores c/u)</span>' +
      '<button class="btn btn-ghost btn-sm" data-action="add-team">+ Equipo</button>' +
    '</div>' + teamsHtml + '</div>';

  var randomSection = '<div class="mt16">' +
    '<div class="flex-between" style="margin-bottom:10px;">' +
      '<div><span class="label">Jugadores</span>' +
      '<p class="text-sm text-muted mt4">N\u00famero par \u00b7 m\u00ednimo 4 \u00b7 equipos de 2 al azar</p></div>' +
    '</div>' +
    '<div class="card">' + randomInputs +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">' +
        '<button class="btn btn-ghost btn-sm" data-action="remove-random-player"' +
        (G.randomPlayers.length <= 4 ? ' disabled' : '') + '>&minus; Jugador</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="add-random-player">+ Jugador</button>' +
      '</div>' +
    '</div>' +
    '<p class="text-sm text-muted text-center mt8">' +
      G.randomPlayers.length + ' jugadores &rarr; ' + (G.randomPlayers.length / 2) + ' equipos de 2' +
    '</p></div>';

  var passExtra = G.allowPass
    ? '<div class="flex-between mt12"><span>M\u00e1ximo de pases por turno</span>' +
      '<input type="number" data-action="max-passes" value="' + G.maxPasses + '" min="1" max="20" style="width:62px;"></div>'
    : '';

  return '<div>' +
    '<div class="mt24">' +
      '<div class="title">&#128221; Papelitos</div>' +
      '<p class="text-sm text-muted mt4">3 rondas &middot; habla libre &rarr; una palabra &rarr; m\u00edmica</p>' +
    '</div>' +
    '<div class="mt24">' +
      '<span class="label">Modo de equipos</span>' +
      '<div class="mode-tabs">' +
        '<button class="btn ' + (isManual ? 'btn-dark' : 'btn-ghost') + '" data-action="set-mode-manual">&#9997;&#65039; Manual</button>' +
        '<button class="btn ' + (!isManual ? 'btn-dark' : 'btn-ghost') + '" data-action="set-mode-random">&#127922; Al azar</button>' +
      '</div>' +
    '</div>' +
    (isManual ? manualSection : randomSection) +
    '<div class="card mt8">' +
      '<span class="label">Configuraci\u00f3n</span>' +
      '<div class="flex-between mt12"><span>Palabras por jugador</span>' +
        '<input type="number" data-action="words-per-player" value="' + G.wordsPerPlayer + '" min="1" max="20" style="width:62px;"></div>' +
      '<div class="flex-between mt12"><span>Tiempo por turno (seg)</span>' +
        '<input type="number" data-action="turn-time" value="' + G.turnTime + '" min="15" max="300" style="width:62px;"></div>' +
      '<hr class="divider">' +
      '<div class="flex-center gap8">' +
        '<input type="checkbox" id="cb-pass" data-action="toggle-pass"' + (G.allowPass ? ' checked' : '') + '>' +
        '<label for="cb-pass" style="cursor:pointer;">Permitir pasar palabras</label>' +
      '</div>' + passExtra +
    '</div>' +
    '<button class="btn btn-dark btn-block mt12" style="padding:14px;" data-action="' +
      (isManual ? 'start-word-entry' : 'sort-random-teams') + '">' +
      (isManual ? 'Continuar &rarr; ingresar palabras' : '&#127922; Sortear equipos') +
    '</button>' +
  '</div>';
}

// ── Screen: Random Preview ────────────────────────────────────────────────────
function screenRndPreview() {
  var teams = '';
  for (var i = 0; i < G.teams.length; i++) {
    var t = G.teams[i];
    var chips = '';
    for (var j = 0; j < t.players.length; j++) {
      chips += '<span class="player-chip">' + esc(t.players[j].name) + '</span>';
    }
    teams += '<div class="team-preview" style="border-color:' + col(i) + ';">' +
      '<div style="min-width:76px;"><div class="label">' + esc(t.name) + '</div></div>' +
      '<div>' + chips + '</div>' +
    '</div>';
  }
  return '<div class="mt24">' +
    '<div class="title">&#127922; Equipos sorteados</div>' +
    '<p class="text-muted mt4 text-sm">' + G.teams.length + ' equipos de 2 jugadores</p>' +
    teams +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;">' +
      '<button class="btn btn-ghost" data-action="reshuffle-teams">&#128256; Sortear de nuevo</button>' +
      '<button class="btn btn-dark" data-action="confirm-random-teams">\u00a1Estos equipos! &rarr;</button>' +
    '</div>' +
  '</div>';
}

// ── Screen: Word Entry ────────────────────────────────────────────────────────
function screenWordEntry() {
  var p = G.allPlayers[G.entryIdx];
  var team = G.teams[p.teamIdx];
  var c = col(p.teamIdx);
  var inputs = '';
  for (var i = 0; i < G.wordsPerPlayer; i++) {
    inputs += '<div' + (i > 0 ? ' style="margin-top:8px;"' : '') + '>' +
      '<input type="text" id="word-' + i + '" placeholder="Palabra ' + (i+1) + '"' +
      ' autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="sentences">' +
      '</div>';
  }
  return '<div class="mt24">' +
    '<div style="border-left:4px solid ' + c + ';padding-left:14px;">' +
      '<div class="label">' + esc(team.name) + ' &middot; ' + (G.entryIdx+1) + ' / ' + G.allPlayers.length + '</div>' +
      '<div class="subtitle mt4">Hola, ' + esc(p.name) + '! &#128075;</div>' +
      '<p class="text-sm text-muted mt4">Escribe tus ' + G.wordsPerPlayer + ' palabras secretas. Solo t\u00fa las ves.</p>' +
    '</div>' +
    '<div class="card mt16">' + inputs + '</div>' +
    '<button class="btn btn-dark btn-block mt8" data-action="submit-words">Listo &#10003;</button>' +
  '</div>';
}

// ── Screen: Blank ─────────────────────────────────────────────────────────────
function screenBlank() {
  var prev = G.allPlayers[G.entryIdx - 1];
  var next = G.allPlayers[G.entryIdx];
  var wc = 0;
  for (var i = 0; i < G.teams.length; i++) {
    for (var j = 0; j < G.teams[i].players.length; j++) {
      wc += G.teams[i].players[j].words ? G.teams[i].players[j].words.length : 0;
    }
  }
  var body;
  if (next) {
    body = '<div class="card mt24" style="text-align:left;">' +
        '<span class="label">Siguiente</span>' +
        '<div class="subtitle mt4">' + esc(next.name) + '</div>' +
        '<div class="text-sm text-muted mt4">' + esc(G.teams[next.teamIdx].name) + '</div>' +
      '</div>' +
      '<button class="btn btn-dark btn-block mt12" data-action="next-player-entry">' +
        'Soy ' + esc(next.name) + ' \u2014 continuar &rarr;' +
      '</button>';
  } else {
    body = '<div class="card mt24">' +
        '<p>\u00a1Todos han ingresado sus palabras!</p>' +
        '<p class="text-sm text-muted mt4">' + wc + ' palabras en el bowl</p>' +
      '</div>' +
      '<button class="btn btn-dark btn-block mt12" data-action="start-game">\u00a1A jugar! &#127881;</button>';
  }
  return '<div style="min-height:88vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;text-align:center;padding:0 8px;">' +
    '<div style="font-size:3.5rem;">&#9989;</div>' +
    '<div class="subtitle mt8">\u00a1Listo, ' + esc(prev ? prev.name : '') + '!</div>' +
    '<p class="text-muted mt4">P\u00e1sale el tel\u00e9fono a la siguiente persona.</p>' +
    body +
  '</div>';
}

// ── Screen: Turn Ready ────────────────────────────────────────────────────────
function screenTurnReady() {
  var team = G.teams[G.teamTurnIdx];
  var c = col(G.teamTurnIdx);
  var explIdx = G.explainerPerTeam[G.teamTurnIdx] || 0;
  var explainer = team.players[explIdx];
  var others = [];
  for (var i = 0; i < team.players.length; i++) {
    if (i !== explIdx) others.push(team.players[i]);
  }
  var ri = ROUND_INFO[G.round - 1];
  var othersHtml = others.length
    ? '<div class="mt12"><span class="label">Adivina' + (others.length > 1 ? 'n' : '') + '</span>' +
      '<p class="mt4">' + others.map(function(o){ return esc(o.name); }).join(', ') + '</p></div>'
    : '';
  return '<div class="mt16">' +
    '<div class="flex-between">' +
      '<span class="round-badge">' + ri.label + '</span>' +
      '<span class="text-sm text-muted">' + G.bowl.length + ' en el bowl</span>' +
    '</div>' +
    '<div class="card mt12" style="border-left:4px solid ' + c + ';text-align:center;padding:24px 18px;">' +
      '<span class="label">Turno de</span>' +
      '<div class="title mt4">' + esc(team.name) + '</div>' +
      '<hr class="divider">' +
      '<div><span class="label">Explica &#127908;</span>' +
        '<div class="subtitle mt4" style="color:' + c + '">' + esc(explainer ? explainer.name : '') + '</div>' +
      '</div>' + othersHtml +
    '</div>' +
    '<div class="card-flat mt8">' +
      '<span class="label">Regla de esta ronda</span>' +
      '<p class="mt4">' + ri.rule + '</p>' +
    '</div>' +
    '<div class="mt12"><span class="label">Puntaje acumulado</span>' + scoreWidget() + '</div>' +
    '<button class="btn btn-dark btn-block mt12" style="padding:16px;" data-action="start-turn">' +
      '\u00a1Estamos listos! &rarr;' +
    '</button>' +
  '</div>';
}

// ── Screen: Turn Active ───────────────────────────────────────────────────────
function screenTurnActive() {
  var ri = ROUND_INFO[G.round - 1];
  var team = G.teams[G.teamTurnIdx];
  var c = col(G.teamTurnIdx);
  var urgent = G.timeLeft <= 10;
  var passesLeft = G.maxPasses - G.passesUsed;
  var canPass = G.allowPass && passesLeft > 0;
  var guessedTags = '';
  for (var i = 0; i < G.guessedThisTurn.length; i++) {
    guessedTags += '<span class="word-tag tag-won">' + esc(G.guessedThisTurn[i]) + '</span>';
  }
  var guessedSection = G.guessedThisTurn.length
    ? '<div class="mt16" style="text-align:left;"><span class="label">Adivinadas este turno (' + G.guessedThisTurn.length + ')</span><div class="mt4">' + guessedTags + '</div></div>'
    : '';
  var passBtn = G.allowPass
    ? '<button class="btn btn-ghost" data-action="pass"' + (!canPass ? ' disabled' : '') +
      ' style="padding:20px 12px;font-size:1rem;">&#9197; Pasar (' + Math.max(0, passesLeft) + ')</button>'
    : '';
  var gridCols = G.allowPass ? '1fr 1fr' : '1fr';
  return '<div style="padding-top:8px;text-align:center;">' +
    '<div class="flex-between" style="margin-bottom:4px;">' +
      '<span class="round-badge">' + ri.label + '</span>' +
      '<span style="font-size:0.8rem;font-weight:600;color:' + c + '">' + esc(team.name) + '</span>' +
    '</div>' +
    '<div id="timer-display" class="timer-display' + (urgent ? ' timer-urgent' : '') + '">' + G.timeLeft + '</div>' +
    '<div class="card" style="margin-top:4px;padding:24px 16px;">' +
      '<div class="big-word">' + esc(G.currentWord || '...') + '</div>' +
      '<p class="text-sm text-muted mt8">' + ri.rule + '</p>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:' + gridCols + ';gap:10px;margin-top:10px;">' +
      '<button class="btn btn-green" data-action="guess" style="padding:20px 12px;font-size:1.05rem;">&#9989; Adivinada</button>' +
      passBtn +
    '</div>' +
    guessedSection +
  '</div>';
}

// ── Screen: Turn Done ─────────────────────────────────────────────────────────
function screenTurnDone() {
  var team = G.teams[G.teamTurnIdx];
  var c = col(G.teamTurnIdx);
  var earned = G.guessedThisTurn.length;
  var isRoundOver = G.bowlEmptiedThisTurn;
  var ri = ROUND_INFO[G.round - 1];
  var tags = '';
  for (var i = 0; i < G.guessedThisTurn.length; i++) {
    tags += '<span class="word-tag tag-won">' + esc(G.guessedThisTurn[i]) + '</span>';
  }
  var earnedSection = earned
    ? '<div class="mt12" style="text-align:left;"><span class="label">Palabras adivinadas</span><div class="mt4">' + tags + '</div></div>'
    : '<p class="text-muted mt8 text-sm">Sin palabras adivinadas esta vez</p>';
  var bowlMsg = isRoundOver
    ? '\u00a1El bowl qued\u00f3 vac\u00edo! Fin de la ' + ri.label + '.'
    : G.bowl.length + ' palabra' + (G.bowl.length !== 1 ? 's' : '') + ' quedan en el bowl';
  var nextLbl = isRoundOver
    ? (G.round === 3 ? 'Ver ganador &#127942;' : 'Resultados de la ' + ri.label + ' &rarr;')
    : 'Siguiente turno &rarr;';
  return '<div class="mt24" style="text-align:center;">' +
    '<div class="title">&#9201;&#65039; \u00a1Tiempo!</div>' +
    '<div class="card mt16">' +
      '<div class="label">' + esc(team.name) + '</div>' +
      '<div class="subtitle mt4" style="color:' + c + '">+' + earned + ' punto' + (earned !== 1 ? 's' : '') + '</div>' +
      earnedSection +
    '</div>' +
    '<p class="text-muted text-sm mt8">' + bowlMsg + '</p>' +
    '<div class="mt16" style="text-align:left;"><span class="label">Puntaje acumulado</span>' + scoreWidget() + '</div>' +
    '<button class="btn btn-dark btn-block mt12" data-action="next-after-turn">' + nextLbl + '</button>' +
  '</div>';
}

// ── Screen: Round End ─────────────────────────────────────────────────────────
function screenRoundEnd() {
  var ri = ROUND_INFO[G.round - 1];
  var nextRi = G.round < 3 ? ROUND_INFO[G.round] : null;
  var ranked = [];
  for (var i = 0; i < G.teams.length; i++) ranked.push({ name: G.teams[i].name, score: scoreVal(i), idx: i });
  ranked.sort(function(a, b) { return b.score - a.score; });
  var rows = '';
  for (var r = 0; r < ranked.length; r++) {
    rows += '<div class="score-row">' +
      '<div>' + (MEDALS[r] || '') + '&nbsp;<span style="font-weight:' + (r === 0 ? 600 : 400) + '">' + esc(ranked[r].name) + '</span></div>' +
      '<span class="score-num" style="color:' + col(ranked[r].idx) + '">' + ranked[r].score + '</span>' +
    '</div>';
  }
  var nextSection = nextRi
    ? '<div class="card-flat mt8" style="text-align:left;">' +
        '<span class="label">Siguiente: ' + nextRi.label + '</span>' +
        '<p class="mt4">' + nextRi.rule + '</p>' +
        '<p class="text-sm text-muted mt8">&#128221; Las mismas ' + G.allWords.length + ' palabras vuelven al bowl</p>' +
      '</div>' +
      '<button class="btn btn-dark btn-block mt12" data-action="next-round">Comenzar ' + nextRi.label + ' &rarr;</button>'
    : '<button class="btn btn-dark btn-block mt12" data-action="show-winner">Ver ganador &#127942;</button>';
  return '<div class="mt24" style="text-align:center;">' +
    '<div class="title">Fin de la ' + ri.label + ' &#127881;</div>' +
    '<div class="card mt16" style="text-align:left;"><span class="label">Puntaje acumulado</span>' + rows + '</div>' +
    nextSection +
  '</div>';
}

// ── Screen: Game Over ─────────────────────────────────────────────────────────
function screenGameOver() {
  var ranked = [];
  for (var i = 0; i < G.teams.length; i++) ranked.push({ name: G.teams[i].name, score: scoreVal(i), idx: i });
  ranked.sort(function(a, b) { return b.score - a.score; });
  var isTie = ranked.length > 1 && ranked[0].score === ranked[1].score;
  var rows = '';
  for (var r = 0; r < ranked.length; r++) {
    rows += '<div class="score-row">' +
      '<div>' + (MEDALS[r] || '') + '&nbsp;<span style="font-weight:' + (r === 0 ? 600 : 400) + '">' + esc(ranked[r].name) + '</span></div>' +
      '<span class="score-num" style="color:' + col(ranked[r].idx) + '">' + ranked[r].score + '</span>' +
    '</div>';
  }
  return '<div class="mt24" style="text-align:center;">' +
    '<div style="font-size:4rem;">&#127942;</div>' +
    '<div class="title mt8">' + (isTie ? '\u00a1Empate \u00e9pico!' : '\u00a1Gan\u00f3 ' + esc(ranked[0].name) + '!') + '</div>' +
    '<div class="card mt16" style="text-align:left;"><span class="label">Resultados finales</span>' + rows + '</div>' +
    '<button class="btn btn-ghost btn-block mt16" data-action="restart">&#128260; Nueva partida</button>' +
  '</div>';
}

// ── Game Logic ────────────────────────────────────────────────────────────────
function startWordEntry() {
  for (var i = 0; i < G.teams.length; i++) {
    var t = G.teams[i];
    if (!t.name.trim()) { alert('Por favor ponle nombre a todos los equipos.'); return; }
    if (t.players.length !== 2) { alert('Cada equipo debe tener exactamente 2 jugadores.'); return; }
    for (var j = 0; j < t.players.length; j++) {
      if (!t.players[j].name.trim()) { alert('Por favor completa todos los nombres de jugadores.'); return; }
    }
  }
  beginWordEntry();
}

function sortRandomTeams() {
  var names = [];
  for (var i = 0; i < G.randomPlayers.length; i++) names.push(G.randomPlayers[i].trim());
  for (var i = 0; i < names.length; i++) {
    if (!names[i]) { alert('Por favor completa todos los nombres.'); return; }
  }
  if (names.length < 4)       { alert('Se necesitan al menos 4 jugadores.'); return; }
  if (names.length % 2 !== 0) { alert('El n\u00famero de jugadores debe ser par. Actualmente hay ' + names.length + '.'); return; }
  applyRandomShuffle(names);
  G.screen = 'rnd-preview';
  render();
}

function applyRandomShuffle(names) {
  var s = shuffle(names);
  var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  G.teams = [];
  for (var i = 0; i < s.length; i += 2) {
    var idx = i / 2;
    G.teams.push({
      name: 'Equipo ' + (letters[idx] || String(idx + 1)),
      players: [{ name: s[i] }, { name: s[i + 1] }]
    });
  }
}

function reshuffleTeams() {
  var names = [];
  for (var i = 0; i < G.teams.length; i++) {
    for (var j = 0; j < G.teams[i].players.length; j++) {
      names.push(G.teams[i].players[j].name);
    }
  }
  applyRandomShuffle(names);
  render();
}

function confirmRandomTeams() {
  beginWordEntry();
}

function beginWordEntry() {
  G.allPlayers = [];
  for (var ti = 0; ti < G.teams.length; ti++) {
    for (var pi = 0; pi < G.teams[ti].players.length; pi++) {
      G.allPlayers.push({ teamIdx: ti, playerIdx: pi, name: G.teams[ti].players[pi].name.trim() });
    }
  }
  G.entryIdx = 0;
  G.showBlank = false;
  G.screen = 'word-entry';
  render();
}

function submitWords() {
  var words = [];
  for (var i = 0; i < G.wordsPerPlayer; i++) {
    var el = document.getElementById('word-' + i);
    var v = el ? el.value.trim() : '';
    if (!v) { alert('Completa las ' + G.wordsPerPlayer + ' palabras antes de continuar.'); return; }
    words.push(v);
  }
  var p = G.allPlayers[G.entryIdx];
  G.teams[p.teamIdx].players[p.playerIdx].words = words;
  G.entryIdx++;
  G.showBlank = true;
  render();
}

function startGame() {
  G.allWords = [];
  for (var i = 0; i < G.teams.length; i++) {
    for (var j = 0; j < G.teams[i].players.length; j++) {
      var ws = G.teams[i].players[j].words || [];
      for (var k = 0; k < ws.length; k++) G.allWords.push(ws[k]);
    }
  }
  G.round = 1;
  G.scores = [];
  for (var i = 0; i < G.teams.length; i++) G.scores.push(0);
  G.teamTurnIdx = 0;
  G.explainerPerTeam = [];
  for (var i = 0; i < G.teams.length; i++) G.explainerPerTeam.push(0);
  G.bowl = shuffle(G.allWords);
  G.screen = 'game';
  G.gamePhase = 'turn-ready';
  render();
}

function startTurn() {
  if (G.bowl.length === 0) { endRound(); return; }
  ensureAudio();
  G.guessedThisTurn = [];
  G.passesUsed = 0;
  G.bowlEmptiedThisTurn = false;
  G.timeLeft = G.turnTime;
  G.currentWord = G.bowl.shift();
  G.gamePhase = 'turn-active';
  render();
  clearInterval(G.timerHandle);
  G.timerHandle = setInterval(function() {
    G.timeLeft--;
    var el = document.getElementById('timer-display');
    if (el) {
      el.textContent = G.timeLeft;
      if (G.timeLeft <= 10) el.className = el.className.replace(' timer-urgent','') + ' timer-urgent';
    }
    if (G.timeLeft <= 0) { clearInterval(G.timerHandle); timeUp(); }
  }, 1000);
}

function timeUp() {
  playBuzzer();
  if (G.currentWord) { G.bowl.push(G.currentWord); G.currentWord = null; }
  G.gamePhase = 'turn-done';
  render();
}

function onGuess() {
  if (!G.currentWord) return;
  G.guessedThisTurn.push(G.currentWord);
  G.scores[G.teamTurnIdx]++;
  G.currentWord = null;
  if (G.bowl.length === 0) {
    clearInterval(G.timerHandle);
    G.bowlEmptiedThisTurn = true;
    G.gamePhase = 'turn-done';
    render();
    return;
  }
  G.currentWord = G.bowl.shift();
  render();
}

function onPass() {
  if (!G.currentWord || !G.allowPass || G.passesUsed >= G.maxPasses) return;
  G.passesUsed++;
  if (G.bowl.length > 0) {
    var pos = 1 + Math.floor(Math.random() * G.bowl.length);
    G.bowl.splice(Math.min(pos, G.bowl.length), 0, G.currentWord);
  } else {
    G.bowl.push(G.currentWord);
  }
  G.currentWord = G.bowl.shift();
  render();
}

function nextAfterTurn() {
  if (G.bowlEmptiedThisTurn) { endRound(); return; }
  advanceTeam();
  G.gamePhase = 'turn-ready';
  render();
}
function endRound() {
  G.gamePhase = G.round === 3 ? 'game-over' : 'round-end';
  render();
}
function advanceTeam() {
  var t = G.teams[G.teamTurnIdx];
  G.explainerPerTeam[G.teamTurnIdx] = (G.explainerPerTeam[G.teamTurnIdx] + 1) % t.players.length;
  G.teamTurnIdx = (G.teamTurnIdx + 1) % G.teams.length;
}
function nextRound() {
  G.round++;
  G.bowl = shuffle(G.allWords.slice());
  advanceTeam();
  G.gamePhase = 'turn-ready';
  render();
}
function restartGame() {
  clearInterval(G.timerHandle);
  G.timerHandle = null;
  for (var i = 0; i < G.teams.length; i++) {
    for (var j = 0; j < G.teams[i].players.length; j++) {
      delete G.teams[i].players[j].words;
    }
  }
  if (G.configMode === 'random') {
    G.teams = [
      { name: 'Equipo 1', players: [{ name: '' }, { name: '' }] },
      { name: 'Equipo 2', players: [{ name: '' }, { name: '' }] }
    ];
  }
  G.screen = 'config'; G.round = 1; G.allWords = []; G.bowl = []; G.scores = [];
  G.gamePhase = 'turn-ready'; G.entryIdx = 0; G.showBlank = false;
  G.currentWord = null; G.guessedThisTurn = []; G.passesUsed = 0;
  G.timeLeft = 0; G.bowlEmptiedThisTurn = false;
  render();
}

// ── Events ────────────────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  var app = document.getElementById('app');

  app.addEventListener('click', function(e) {
    var el = e.target;
    // Walk up to find data-action element
    while (el && el !== app) {
      if (el.getAttribute('data-action')) break;
      el = el.parentNode;
    }
    if (!el || el === app) return;
    if (el.tagName === 'INPUT' || el.tagName === 'LABEL') return;
    var action = el.getAttribute('data-action');
    var ti = parseInt(el.getAttribute('data-ti'), 10);
    var pi = parseInt(el.getAttribute('data-pi'), 10);

    if      (action === 'set-mode-manual')      { G.configMode = 'manual'; render(); }
    else if (action === 'set-mode-random')      { G.configMode = 'random'; render(); }
    else if (action === 'add-team')             {
      var L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[G.teams.length] || String(G.teams.length + 1);
      G.teams.push({ name: 'Equipo ' + L, players: [{ name: '' }, { name: '' }] });
      render();
    }
    else if (action === 'remove-team')          { if (G.teams.length > 2) { G.teams.splice(ti, 1); render(); } }
    else if (action === 'add-random-player')    { G.randomPlayers.push(''); render(); }
    else if (action === 'remove-random-player') { if (G.randomPlayers.length > 4) { G.randomPlayers.pop(); render(); } }
    else if (action === 'start-word-entry')     { startWordEntry(); }
    else if (action === 'sort-random-teams')    { sortRandomTeams(); }
    else if (action === 'reshuffle-teams')      { reshuffleTeams(); }
    else if (action === 'confirm-random-teams') { confirmRandomTeams(); }
    else if (action === 'submit-words')         { submitWords(); }
    else if (action === 'next-player-entry')    { G.showBlank = false; render(); }
    else if (action === 'start-game')           { startGame(); }
    else if (action === 'start-turn')           { startTurn(); }
    else if (action === 'guess')                { onGuess(); }
    else if (action === 'pass')                 { onPass(); }
    else if (action === 'next-after-turn')      { nextAfterTurn(); }
    else if (action === 'next-round')           { nextRound(); }
    else if (action === 'show-winner')          { G.gamePhase = 'game-over'; render(); }
    else if (action === 'restart')              { restartGame(); }
  });

  app.addEventListener('input', function(e) {
    var el = e.target;
    var action = el.getAttribute('data-action');
    if (!action || el.type === 'checkbox') return;
    var ti = parseInt(el.getAttribute('data-ti'), 10);
    var pi = parseInt(el.getAttribute('data-pi'), 10);
    var v = el.value;
    if      (action === 'team-name')          { if (G.teams[ti]) G.teams[ti].name = v; }
    else if (action === 'player-name')        { if (G.teams[ti] && G.teams[ti].players[pi]) G.teams[ti].players[pi].name = v; }
    else if (action === 'random-player-name') { var idx = parseInt(el.getAttribute('data-idx'), 10); if (idx >= 0) G.randomPlayers[idx] = v; }
    else if (action === 'words-per-player')   { G.wordsPerPlayer = Math.max(1, Math.min(20, parseInt(v, 10) || 5)); }
    else if (action === 'turn-time')          { G.turnTime = Math.max(15, Math.min(300, parseInt(v, 10) || 60)); }
    else if (action === 'max-passes')         { G.maxPasses = Math.max(1, Math.min(20, parseInt(v, 10) || 3)); }
  });

  app.addEventListener('change', function(e) {
    var el = e.target;
    if (el.getAttribute('data-action') === 'toggle-pass' && el.type === 'checkbox') {
      G.allowPass = el.checked;
      render();
    }
  });

  render();
});
</script>
</body>
</html>
